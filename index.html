<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent 开发工程师面试通关指南</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <aside id="aside">
    <div class="brand">
      <h1>🤖 Agent 面试通关指南</h1>
      <div class="sub">Agent 开发工程师 · 系统化学习手册</div>
    </div>
    <div class="progress-wrap">
      <div class="progress-ring">
        <div class="ring">
          <svg width="52" height="52"><circle cx="26" cy="26" r="22" fill="none" stroke="var(--panel2)" stroke-width="5"/><circle id="ring-fg" cx="26" cy="26" r="22" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" stroke-dasharray="138.2" stroke-dashoffset="138.2"/></svg>
          <div class="num" id="ring-num">0%</div>
        </div>
        <div class="progress-meta">已掌握考点<br><b id="stat-mastered">0 / 0</b><br><span id="stat-qa"></span></div>
      </div>
    </div>
    <div class="toolbar">
      <input id="search" type="search" placeholder="🔍 搜索考点 / 面试题…">
      <button class="tbtn" id="btn-home" title="总览仪表盘">📊 总览</button>
      <button class="tbtn" id="btn-roadmap" title="学习路线图">🗺️ 路线</button>
      <button class="tbtn" id="btn-mock" title="模拟面试">🎤 模拟面试</button>
      <button class="tbtn" id="btn-filter" title="只看未掌握">◎ 筛选</button>
      <button class="tbtn" id="btn-theme" title="切换主题">🌙</button>
      <button class="tbtn" id="btn-reset" title="清空进度">↺</button>
    </div>
    <nav id="nav"></nav>
    <div class="aside-foot">在线静态版 · 进度仅保存在本机浏览器<br>Agent Interview Prep v1.0</div>
  </aside>

  <main id="main">
    <section class="page" id="page-home"></section>
    <section class="page" id="page-roadmap"></section>
    <section class="page" id="page-topic"></section>
    <section class="page" id="page-mock"></section>
    <section class="page" id="page-search"></section>
  </main>
</div>
<button id="menu-fab" title="目录">☰</button>
  <script src="parts/part1-tech-core.js" defer></script>
  <script src="parts/part2-tech-eng.js" defer></script>
  <script src="parts/part3-exp-soft.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
